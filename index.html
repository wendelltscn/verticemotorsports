<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://i.imgur.com/LJaOS15.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VERTICE MOTORSPORTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="preconnect" href="https://i.imgur.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://forminit.com/sdk/v1/forminit.js" defer></script>
    <style>
      /* === THEME VARIABLES === */
      body {
        --bg-color: #000000;
        --text-color: #9ca3af; /* gray-400 */
        --text-color-strong: #ffffff;
        --border-color: #374151; /* gray-700 */
        --border-color-light: #1f2937; /* gray-800 */
        --accent-color: #fde047; /* yellow-300 */
        --accent-text-color: #000000;
        --redline-color: #ef4444; /* red-500 */
        --overlay-color: #000000;
        --bg-modal: #0A0F1A;
        --bg-card-glass: rgba(255, 255, 255, 0.05);
        --border-card-glass: rgba(255, 255, 255, 0.1);
      }

      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Roboto Mono', monospace;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      .font-editorial {
        font-family: 'Cinzel', serif;
        font-weight: 700;
      }
      .font-technical {
        font-family: 'Roboto Mono', monospace;
      }
      
      /* === THEME-AWARE STYLES === */
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--accent-color);
        border-radius: 10px;
      }

      /* Text Colors */
      .text-white { color: var(--text-color-strong); }
      .text-black { color: var(--accent-text-color); }
      .text-gray-300 { color: var(--text-color); }
      .text-gray-400 { color: var(--text-color); }
      .text-gray-500 { color: color-mix(in srgb, var(--text-color) 80%, var(--bg-color)); }
      .text-gray-600 { color: color-mix(in srgb, var(--text-color) 60%, var(--bg-color)); }
      .text-gray-700 { color: color-mix(in srgb, var(--text-color) 40%, var(--bg-color)); }
      .text-yellow-300, .text-orange-400 { color: var(--accent-color); }
      
      /* Background Colors */
      .bg-black { background-color: var(--bg-color); }
      .bg-modal { background-color: var(--bg-modal); }
      .bg-overlay-30 { background-color: color-mix(in srgb, var(--overlay-color) 30%, transparent); }
      .bg-overlay-40 { background-color: color-mix(in srgb, var(--overlay-color) 40%, transparent); }
      .bg-overlay-50 { background-color: color-mix(in srgb, var(--overlay-color) 50%, transparent); }
      .bg-overlay-60 { background-color: color-mix(in srgb, var(--overlay-color) 60%, transparent); }
      .bg-overlay-70 { background-color: color-mix(in srgb, var(--overlay-color) 70%, transparent); }
      .bg-overlay-80 { background-color: color-mix(in srgb, var(--overlay-color) 80%, transparent); }
      .bg-overlay-90 { background-color: color-mix(in srgb, var(--overlay-color) 90%, transparent); }
      .bg-overlay-95 { background-color: color-mix(in srgb, var(--overlay-color) 95%, transparent); }
      .bg-yellow-300 { background-color: var(--accent-color); color: var(--accent-text-color); }
      .bg-gray-900\/20 { background-color: var(--bg-card-glass); }
      .bg-gray-900\/50 { background-color: color-mix(in srgb, var(--text-color) 10%, transparent); }
      .bg-black\/30 { background-color: color-mix(in srgb, var(--overlay-color) 30%, transparent); }
      .bg-black\/40 { background-color: color-mix(in srgb, var(--overlay-color) 40%, transparent); }
      
      /* Border Colors */
      .border-gray-700 { border-color: var(--border-color); }
      .border-gray-800 { border-color: var(--border-color-light); }
      .border-gray-900 { border-color: var(--border-card-glass); }
      .border-yellow-300, .border-orange-400 { border-color: var(--accent-color); }

      /* Gradient Overlay */
      .bg-gradient-overlay-bottom {
        background: linear-gradient(to top, color-mix(in srgb, var(--overlay-color) 100%, transparent) 0%, color-mix(in srgb, var(--overlay-color) 70%, transparent) 50%, transparent 100%);
      }

      /* Hover States */
      .hover\:text-yellow-300:hover { color: var(--accent-color); }
      .hover\:text-white:hover { color: var(--text-color-strong); }
      .hover\:border-yellow-300:hover { border-color: var(--accent-color); }
      .hover\:border-yellow-300\/50:hover { border-color: color-mix(in srgb, var(--accent-color) 50%, transparent); }
      .hover\:bg-yellow-300:hover { background-color: var(--accent-color); color: var(--accent-text-color); }
      .hover\:bg-transparent:hover { background-color: transparent; }
      .hover\:bg-gray-800:hover { background-color: var(--border-color-light); }
      
      /* Redline Effect */
      #redline-effect div {
        background-color: var(--redline-color) !important;
        box-shadow: 0 0 10px var(--redline-color), 0 0 20px var(--redline-color) !important;
      }

      /* === LIVE LAYER & UI FEEDBACK === */
      
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(18, 18, 18, 0) 0%, rgba(18, 18, 18, 0.2) 50%, rgba(18, 18, 18, 0) 100%);
        opacity: 0.3;
        z-index: 9998;
        pointer-events: none;
        animation: scanline 8s linear infinite;
      }

      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }


      /* Subtle Grain Overlay */
      body::after {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        right: -50%;
        bottom: -50%;
        width: 200%;
        height: 200%;
        pointer-events: none;
        background: transparent url('data:image/svg+xml,<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="6" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
        opacity: 0.025;
        z-index: 9999;
        animation: grain 8s steps(10) infinite;
      }
      @keyframes grain {
        0%, 100% { transform: translate(0, 0) }
        10% { transform: translate(-5%, -10%) }
        20% { transform: translate(-15%, 5%) }
        30% { transform: translate(7%, -25%) }
        40% { transform: translate(-5%, 25%) }
        50% { transform: translate(-15%, 10%) }
        60% { transform: translate(15%, 0%) }
        70% { transform: translate(0%, 15%) }
        80% { transform: translate(3%, 35%) }
        90% { transform: translate(-10%, 10%) }
      }

      /* Cursor & Press Feedback */
      button, a, [onclick] {
        cursor: pointer;
      }
      button:active, a:active {
        transform: scale(0.98);
        transition: transform 0.08s cubic-bezier(0.5, 1, 0.89, 1);
      }

      /* === PROJECT HOTSPOTS === */
      @keyframes pulse-hotspot {
        0%, 100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.5);
          opacity: 1;
        }
      }
      .hotspot-pulse {
        animation: pulse-hotspot 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
      }

      /* === PAGE TRANSITIONS & ANIMATIONS === */

      .page-transition-wrapper {
        transition: opacity 0.4s cubic-bezier(0.65, 0, 0.35, 1), transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .page-transition-wrapper.entering {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      .page-transition-wrapper.exiting {
        opacity: 0;
        transform: scale(0.98) translateY(-8px);
      }
      .page-transition-wrapper.initial {
         opacity: 0;
         transform: scale(1.02) translateY(8px);
      }

      /* Content Stagger Animation */
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* Default Profile */
      .animate-fade-in-up {
        animation: fade-in-up 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* Motion Profiles */
      .animate-fade-in-up-slow {
        animation: fade-in-up 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      .animate-fade-in-up-fast {
        animation: fade-in-up 0.6s cubic-bezier(0.55, 0.055, 0.675, 0.19) both;
      }
      .animate-fade-in-up-elegant {
        animation: fade-in-up 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .animate-fade-in-up-dynamic {
        animation: fade-in-up 0.7s cubic-bezier(0.215, 0.610, 0.355, 1.000) both;
      }

      /* Text Flicker Animation */
       @keyframes text-flicker {
        0%, 100% { opacity: 1; }
        50.0% { opacity: 1; }
        50.2% { opacity: 0.7; }
        50.6% { opacity: 1; }
        75.0% { opacity: 1; }
        75.2% { opacity: 0.5; }
        75.8% { opacity: 1; }
      }
      .animate-text-flicker {
        animation: text-flicker 4s linear infinite;
      }

      /* Ignition Sequence Animation */
      @keyframes rev-rumble {
        0% { transform: translate(0, 0) scale(1.0); }
        10% { transform: translate(-1px, 1px) scale(1.02); }
        20% { transform: translate(1px, -1px) scale(1.04); }
        30% { transform: translate(-1px, 0px) scale(1.02); }
        40% { transform: translate(0px, 1px) scale(1.0); }
        100% { transform: translate(0, 0) scale(1.0); }
      }
      .animate-rev-rumble {
        animation: rev-rumble 0.6s ease-in-out;
      }

      /* Text Glow Animation */
      @keyframes text-glow {
        0%, 100% { text-shadow: 0 0 5px var(--accent-color); }
        50% { text-shadow: 0 0 20px var(--accent-color), 0 0 30px var(--accent-color); }
      }
      .animate-text-glow {
        animation: text-glow 1.5s ease-in-out;
      }

      /* Preloader Animation */
      @keyframes flicker {
        0%, 19.9%, 22%, 62.9%, 64%, 64.9%, 70%, 100% {
            opacity: .99;
        }
        20%, 21.9%, 63%, 63.9%, 65%, 69.9% {
            opacity: .4;
        }
      }
      .animate-flicker {
        animation: flicker 3s infinite;
      }

      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-400 { animation-delay: 400ms; }
      .delay-500 { animation-delay: 500ms; }
      .delay-600 { animation-delay: 600ms; }

      /* Grid Background Animation */
      @keyframes pan-grid {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 100%; }
      }

      /* Original Text Focus (for specific elements) */
      @keyframes text-focus-in {
        0% {
          -webkit-filter: blur(12px);
                  filter: blur(12px);
          opacity: 0;
        }
        100% {
          -webkit-filter: blur(0px);
                  filter: blur(0px);
          opacity: 1;
        }
      }

      .animate-text-focus-in {
	      animation: text-focus-in 1s cubic-bezier(0.550, 0.085, 0.680, 0.530) both;
      }
    </style>
